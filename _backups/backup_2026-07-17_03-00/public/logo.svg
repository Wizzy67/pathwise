<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0056FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2277FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded rectangle background -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>
  <!-- Compass outer ring -->
  <circle cx="50" cy="50" r="26" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Compass needle - North (pointing up-right) -->
  <polygon points="50,24 45,50 50,46 55,50" fill="white" opacity="1"/>
  <!-- Compass needle - South (pointing down-left) -->
  <polygon points="50,76 55,50 50,54 45,50" fill="rgba(255,255,255,0.45)" opacity="1"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="3.5" fill="white"/>
  <!-- Small tick marks -->
  <line x1="50" y1="25" x2="50" y2="29" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="71" x2="50" y2="75" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="50" x2="29" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
  <line x1="71" y1="50" x2="75" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
</svg>
